<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="center">
        <h1>Login</h1>

        <!-- O action aponta para ../index.HTML como garantia nativa -->
        <form id="formLogin" action="index.HTML" method="GET">
            <div class="txt_field">
                <input type="text" id="login" required>
                <label>Usuário / E-mail</label>
            </div>

            <div class="txt_field">
                <input type="password" id="senha" required>
                <label>Senha</label>
            </div>

            <div class="pass">
                Esqueceu a senha?
            </div>

            <div class="botoes">
                <button type="submit" class="btn-conectar">Logar</button>
            </div>

            <div class="signup_link">
                <a href="#">
                    Não é membro? Cadastre-se!
                </a>
            </div>
        </form>
    </div>

    <script src="login.JS"></script>
</body>
</html>
