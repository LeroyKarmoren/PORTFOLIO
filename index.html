<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background-color: #121212 !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            width: 100vw;
        }
        body {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
            z-index: 9999;
        }
        .login-card h1 {
            margin-bottom: 20px;
            color: #ffffff;
        }
        .field {
            margin-bottom: 15px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        .field input {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        .btn-logar {
            width: 100%;
            padding: 10px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-logar:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body style="display: flex !important; visibility: visible !important;">

    <div class="login-card">
        <h1>Login</h1>
        <form id="formLogin">
            <div class="field">
                <label for="login">E-mail</label>
                <input type="email" id="login" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-logar">Logar</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ijpqshxedkgewdxorwxi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqcHFzaHhlZGtnZXdkeG9yd3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyODgxNzQsImV4cCI6MjEwNTg2NDE3NH0.0gJjTgON2u_SlvCT2o8QP9eozrHKRmAquUscqQDSJH8';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login').value;
            const password = document.getElementById('senha').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Erro ao fazer login: ' + error.message);
            } else {
                window.location.replace("portfolio.html");
            }
        });
    </script>
</body>
</html>
