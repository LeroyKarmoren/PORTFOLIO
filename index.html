<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }
        .login-card h1 {
            margin-bottom: 20px;
            color: #ffffff;
        }
        .field {
            margin-bottom: 15px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        .field input {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        .btn-logar {
            width: 100%;
            padding: 10px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-logar:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Login</h1>
        <form id="formLogin">
            <div class="field">
                <label for="login">E-mail</label>
                <input type="email" id="login" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-logar">Logar</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
